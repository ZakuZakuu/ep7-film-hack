name: Unit tests (synthetic only)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upstream filesystem tools (synthetic inputs only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Standard-library unit tests
        run: |
          bash tools/setup_re_environment.sh --core-only
          source /tmp/ep7-re-tools/env.sh
          python -m unittest discover -s tests -v

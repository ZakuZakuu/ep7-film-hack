name: Recipe Studio (synthetic only)
on:
  push:
  pull_request:
jobs:
  recipe-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/recipe_studio/requirements.txt
      - run: python -m pip install -r tools/recipe_studio/requirements.txt
      - run: python -c "import numpy, scipy, PIL, skimage, rawpy, flask"
      - run: python -m unittest discover -s tests -p test_recipe_studio.py -v
